name: JBL WAN proof

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  external-test:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Control GitHub outbound TCP 57120
        run: |
          python3 - <<'PY'
          import socket
          try:
              with socket.create_connection(("portquiz.net", 57120), timeout=8):
                  print("CONTROL_GITHUB_EGRESS_57120_ALLOWED")
          except Exception as error:
              print("CONTROL_GITHUB_EGRESS_57120_FAILED")
              print("CONTROL_RESULT_TYPE=" + type(error).__name__)
          PY

      - name: Test external TCP and JBL WebSocket reachability
        env:
          TARGET_IPV4: ${{ secrets.TARGET_IPV4 }}
        run: |
          python3 - <<'PY'
          import base64
          import os
          import socket

          host = os.environ["TARGET_IPV4"]
          port = 57120

          try:
              sock = socket.create_connection((host, port), timeout=8)
          except Exception as error:
              print("TCP_CONNECTION_NOT_ESTABLISHED_FROM_RUNNER")
              print("TCP_RESULT_TYPE=" + type(error).__name__)
              raise SystemExit(0)

          print("TCP_CONNECTION_ESTABLISHED_FROM_RUNNER")
          with sock:
              sock.settimeout(8)
              key = base64.b64encode(os.urandom(16)).decode()
              request = (
                  "GET / HTTP/1.1\r\n"
                  f"Host: {host}:{port}\r\n"
                  "Connection: Upgrade\r\n"
                  "Upgrade: websocket\r\n"
                  "Sec-WebSocket-Version: 13\r\n"
                  f"Sec-WebSocket-Key: {key}\r\n"
                  "Sec-WebSocket-Protocol: quantum_rc\r\n"
                  "\r\n"
              ).encode()
              try:
                  sock.sendall(request)
                  response = sock.recv(4096)
                  first_line = response.split(b"\r\n", 1)[0]
                  print("HTTP_STATUS=" + first_line.decode("ascii", "replace"))
                  if first_line.split()[:2] == [b"HTTP/1.1", b"101"]:
                      print("HTTP_101_OBSERVED_HANDSHAKE_AND_SERVICE_UNVERIFIED")
                  else:
                      print("TCP_CONNECTED_HTTP_101_NOT_OBSERVED")
              except Exception as error:
                  print("PROTOCOL_OBSERVATION_INCOMPLETE")
                  print("WEBSOCKET_RESULT_TYPE=" + type(error).__name__)
          PY
